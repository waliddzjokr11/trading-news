# How often to check (minutes). GitHub Actions minimum is 5.
# Private repo limit: 2000 min/mo → 30m = ~1440 runs (safe). Public = 15m OK.
poll_interval_minutes: 30

# ── PRICE SIGNAL THRESHOLDS ─────────────────────────────────
price:
  short_window_minutes: 15       # window for short-term % change
  short_change_pct: 3.0          # trigger if price moves ±3% in window
  medium_window_minutes: 60      # window for medium-term % change
  medium_change_pct: 6.0         # trigger if price moves ±6% in 1 hour
  volume_multiplier: 2.5         # trigger if volume is 2.5x rolling average
  rsi_oversold: 30               # RSI below this = oversold (bullish)
  rsi_overbought: 70             # RSI above this = overbought (bearish)
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

# ── SIGNAL WEIGHTS (must sum to 1.0) ────────────────────────
weights:
  price: 0.40
  news: 0.35
  onchain: 0.25

# ── NEWS SETTINGS ────────────────────────────────────────────
news:
  max_age_hours: 4               # ignore news older than this
  min_sources_to_boost: 2        # boost score if story confirmed by N sources
  dedup_ttl_hours: 24            # how long to remember seen headlines

# Custom keyword overrides (adds to built-in list)
keywords:
  bearish_critical_extra: []     # e.g. ["founder arrested", "rug pull"]
  bullish_critical_extra: []     # e.g. ["BlackRock", "Fidelity"]

# ── ALERT SETTINGS ───────────────────────────────────────────
alerts:
  email_enabled: false
  telegram_enabled: true
  cooldown_minutes: 60
  daily_digest_time: "08:00"     # 24h format, your local timezone
  timezone: "Africa/Algiers"     # Oran
  min_signal_to_alert: "BEARISH" # minimum signal level to send alert
                                 # options: DUMP_WARNING, BEARISH, NEUTRAL, BULLISH, STRONG_BUY
  max_alerts_per_run: 20         # cap to avoid spam on 100 coins

# ── DATA SOURCE SETTINGS ─────────────────────────────────────
sources:
  price_primary: "coingecko"     # coingecko | binance | coincap — fallback auto
  news_rss_enabled: true
  onchain_enabled: true
  price_chunk_size: 50           # split 100 coins into chunks of 50 for URL safety

# ── LOGGING ──────────────────────────────────────────────────
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  save_to_file: true
  log_file: "logs/monitor.log"
