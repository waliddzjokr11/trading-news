name: Crypto Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min — private repo safe (1440 runs/mo < 2000 limit). Use '*/15 * * * *' if public.
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
        run: python src/main.py

      - name: Commit state and dashboard
        run: |
          git config user.name "crypto-monitor-bot"
          git config user.email "bot@github-actions"
          git pull --rebase --autostash || true
          git add state.json dashboard/index.html dashboard/.nojekyll 2>/dev/null || git add state.json dashboard/index.html
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push
