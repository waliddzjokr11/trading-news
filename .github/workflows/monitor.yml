name: Crypto Monitor

on:
  schedule:
    - cron: '*/5 * * * *'    # every 5 min realtime (public repo = unlimited minutes)
  workflow_dispatch:           # manual trigger from GitHub UI

concurrency:
  group: crypto-monitor
  # queued (not cancelled): a cancelled mid-run loses its state commit

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 70 coins ~1-2 min; headroom for 429 backoff
    permissions:
      contents: write
      actions: write          # needed for the realtime chaining step below

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python src/main.py

      - name: Keep-alive ping to Render webhook server
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "No WEBHOOK_URL secret — skipping keep-alive"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "${WEBHOOK_URL}/health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Webhook server alive (HTTP 200)"
          else
            echo "Webhook server returned HTTP $STATUS (may be cold-starting)"
          fi

      - name: Validate state before commit
        run: |
          python -c "
          import json, sys
          try:
              with open('state.json') as f:
                  s = json.load(f)
              print('state.json valid. run_count:', s.get('run_count', 0))
          except Exception as e:
              print('state.json INVALID:', e)
              sys.exit(1)
          "

      - name: Commit state and dashboard
        run: |
          git config user.name "crypto-monitor-bot"
          git config user.email "bot@github-actions"
          git add state.json dashboard/index.html docs/index.html 2>/dev/null || git add state.json dashboard/index.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git pull --rebase origin main || true
          git commit -m "chore: update state [skip ci]"
          git push || (git pull --rebase origin main && git push)

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ crypto-monitor GitHub Actions run FAILED. Check: https://github.com/${{ github.repository }}/actions" \
            || true

      # GitHub throttles cron schedules (our */5 was firing every ~4h).
      # Chain the next run via API so signals stay realtime (~5 min cadence).
      # To stop the loop, disable this workflow. Cron remains as backup restart.
      - name: Chain next run (realtime loop)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 180
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches \
            -d '{"ref":"main"}' || true
