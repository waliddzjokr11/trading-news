# How often to check (minutes). GitHub Actions minimum is 5.
# Private repo limit: 2000 min/mo → 30m = ~1440 runs (safe). Public = 15m OK.
poll_interval_minutes: 30

# ── PRICE SIGNAL THRESHOLDS ─────────────────────────────────
price:
  short_window_minutes: 15
  short_change_pct: 5.0          # RAISED from 3.0 → needs bigger move
  medium_window_minutes: 60
  medium_change_pct: 8.0         # RAISED from 6.0
  volume_multiplier: 3.5         # RAISED from 2.5 → only real spikes
  rsi_oversold: 28               # TIGHTENED from 30
  rsi_overbought: 72             # TIGHTENED from 70
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  require_macd_rsi_agreement: true
  min_bars_between_signals: 4

# ── SIGNAL WEIGHTS ────────────────────────────────────────────
weights:
  price: 0.55       # RAISED from 0.40 — price doesn't lie
  news: 0.20        # LOWERED from 0.35 — news is noisy
  onchain: 0.25     # KEPT

# ── SIGNAL SCORE THRESHOLDS ──────────────────────────────────
signal_thresholds:
  strong_buy: 4.5    # RAISED from 4.0
  bullish: 2.5       # RAISED from 1.5
  neutral_high: 1.5
  neutral_low: -1.5
  bearish: -2.5      # TIGHTENED from -1.5
  dump_warning: -4.5 # TIGHTENED from -4.0

# ── ALERT QUALITY GATE ───────────────────────────────────────
alert_quality_gate:
  enabled: true
  buy_requires:
    min_composite_score: 2.5
    min_tv_quality_stars: 4
    min_mtf_confluence: 5
    price_above_ema200: true
    macd_bullish: true
    volume_above_average: true
  sell_requires:
    min_composite_score: -2.5
    min_tv_quality_stars: 4
    min_mtf_confluence: 5
    price_below_ema200: true
    macd_bearish: true
    volume_above_average: true

# ── NEWS SETTINGS ────────────────────────────────────────────
news:
  max_age_hours: 2               # LOWERED from 4 — stale news lags
  min_sources_to_boost: 2
  dedup_ttl_hours: 24
  min_news_score_to_count: 2.0   # news must be ≥ ±2.0 to matter
  min_keyword_matches: 2         # require ≥2 keywords per headline

# Custom keyword overrides (adds to built-in list)
keywords:
  bearish_critical_extra: []     # e.g. ["founder arrested", "rug pull"]
  bullish_critical_extra: []     # e.g. ["BlackRock", "Fidelity"]

# ── ALERT SETTINGS ───────────────────────────────────────────
alerts:
  email_enabled: false
  telegram_enabled: true
  cooldown_minutes: 90           # RAISED from 60 — avoid re-alerting same move
  daily_digest_time: "08:00"
  timezone: "Africa/Algiers"
  min_signal_to_alert: "BULLISH" # CHANGED from BEARISH — only BULLISH+ (BEARISH only if dump)
  max_alerts_per_run: 10         # LOWERED from 20 — quality over quantity
  max_alerts_per_coin_per_day: 3 # NEW — hard cap per coin per day

# ── DATA SOURCE SETTINGS ─────────────────────────────────────
sources:
  price_primary: "coingecko"
  news_rss_enabled: true
  onchain_enabled: true
  price_chunk_size: 50

# ── TRADINGVIEW WEBHOOK ───────────────────────────────────────
tradingview:
  webhook_enabled: true
  webhook_port: 5000
  min_quality_stars: 4           # RAISED from 3 — high conviction only
  tv_signal_weight: 0.55
  news_weight_tv: 0.20
  onchain_weight_tv: 0.25
  require_python_confirmation: true
  python_confirmation_min_score: 1.5
  ngrok_enabled: false

# ── LOGGING ──────────────────────────────────────────────────
logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/monitor.log"