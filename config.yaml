# How often to check (minutes). GitHub Actions minimum is 5.
# Public repo: unlimited minutes → 5m realtime. Private repo: use 15-30m.
poll_interval_minutes: 5

# ── PRICE SIGNAL THRESHOLDS ─────────────────────────────────
price:
  short_window_minutes: 5        # realtime 5m runs: 1 bar lookback
  short_change_pct: 2.5
  medium_window_minutes: 60
  medium_change_pct: 4.5
  volume_multiplier: 2.2
  rsi_oversold: 30
  rsi_overbought: 70
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  require_macd_rsi_agreement: false
  min_bars_between_signals: 4

# ── SIGNAL WEIGHTS ────────────────────────────────────────────
weights:
  price: 0.55       # RAISED from 0.40 — price doesn't lie
  news: 0.20        # LOWERED from 0.35 — news is noisy
  onchain: 0.25     # KEPT

# ── SIGNAL SCORE THRESHOLDS ──────────────────────────────────
signal_thresholds:
  strong_buy: 3.5
  bullish: 1.2       # FIX: 2.5 gave 0/day → 1.2 restores flow but still >1.5? actually 1.2 <1.5, so more BULLISH
  neutral_high: 1.2
  neutral_low: -1.2
  bearish: -1.2
  dump_warning: -3.5

# ── ALERT QUALITY GATE ───────────────────────────────────────
alert_quality_gate:
  enabled: true
  buy_requires:
    min_composite_score: 0.4      # FIX: 0.8 still 0/day on flat → 0.4 allows 1-2 high-quality / day
    min_tv_quality_stars: 4
    min_mtf_confluence: 5
    price_above_ema200: true
    macd_bullish: true
    volume_above_average: false
  sell_requires:
    min_composite_score: -0.4
    min_tv_quality_stars: 4
    min_mtf_confluence: 5
    price_below_ema200: true
    macd_bearish: true
    volume_above_average: false

# ── NEWS SETTINGS ────────────────────────────────────────────
news:
  max_age_hours: 3
  min_sources_to_boost: 2
  dedup_ttl_hours: 24
  min_news_score_to_count: 1.0   # FIX: 2.0 was too strict → 1.0 allows big single-keyword news
  min_keyword_matches: 1         # FIX: 2 was too strict on flat news days → 1

# Custom keyword overrides (adds to built-in list)
keywords:
  bearish_critical_extra: []     # e.g. ["founder arrested", "rug pull"]
  bullish_critical_extra: []     # e.g. ["BlackRock", "Fidelity"]

# ── ALERT SETTINGS ───────────────────────────────────────────
alerts:
  email_enabled: false
  telegram_enabled: true
  cooldown_minutes: 30           # realtime 5m runs: 30m cooldown (was 90 — caused hourly bursts)
  daily_digest_time: "08:00"
  timezone: "Africa/Algiers"
  min_signal_to_alert: "BULLISH" # only BULLISH+ (BEARISH only if dump)
  max_alerts_per_run: 5          # realtime: max 5 per 5m run, no queue (was 10 + delayed queue = bursts)
  max_alerts_per_coin_per_day: 3

# ── DATA SOURCE SETTINGS ─────────────────────────────────────
sources:
  price_primary: "coingecko"
  news_rss_enabled: true
  onchain_enabled: true
  price_chunk_size: 50

# ── TRADINGVIEW WEBHOOK ───────────────────────────────────────
tradingview:
  webhook_enabled: true
  webhook_port: 5000
  min_quality_stars: 4           # RAISED from 3 — high conviction only
  tv_signal_weight: 0.55
  news_weight_tv: 0.20
  onchain_weight_tv: 0.25
  require_python_confirmation: true
  python_confirmation_min_score: 1.5
  ngrok_enabled: false

# ── LOGGING ──────────────────────────────────────────────────
logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/monitor.log"