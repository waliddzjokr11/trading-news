name: Crypto Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min — private repo safe (1440 runs/mo < 2000 limit). Use '*/15 * * * *' if public.
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # kills job if hangs — saves free minutes (200 coins ~3 min, 8 is safe)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python src/main.py

      - name: Keep-alive ping to Render webhook server
        if: env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 "${WEBHOOK_URL}/health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Webhook server alive (HTTP 200)"
          else
            echo "⚠️ Webhook server returned HTTP $STATUS (may be cold-starting)"
          fi

      - name: Validate state before commit
        run: |
          python -c "
          import json, sys
          try:
              with open('state.json') as f:
                  s = json.load(f)
              print('state.json valid. run_count:', s.get('run_count', 0))
          except Exception as e:
              print('state.json INVALID:', e)
              sys.exit(1)
          "

      - name: Commit state and dashboard
        run: |
          git config user.name "crypto-monitor-bot"
          git config user.email "bot@github-actions"
          git add state.json dashboard/index.html docs/index.html logs/ 2>/dev/null || git add state.json dashboard/index.html docs/index.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git pull --rebase origin main || true
          git commit -m "chore: update state [skip ci]"
          git push || (git pull --rebase origin main && git push)

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ crypto-monitor GitHub Actions run FAILED. Check: https://github.com/${{ github.repository }}/actions" \
            || true
