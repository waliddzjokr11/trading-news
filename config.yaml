# 70-coin watchlist: Binance SPOT+FUTURES verified, halal-screened, top volume
# All CoinGecko IDs map to Binance USDT pairs (see COINGECKO_TO_BINANCE_FUTURES for 1000-prefix memes).
# Excluded: privacy (XMR/ZEC/DASH), lending-yield (AAVE/ENA/PENDLE), stables, halted (TON), low-volume memes.
